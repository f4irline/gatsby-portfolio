name: Verify and deploy portfolio

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:
        inputs:
            deploy:
                description: 'Deploy the verified master build to production'
                required: true
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run check
            - run: npm run build
            - run: npm run test:links
            - run: npx playwright install --with-deps chromium
            - run: npm test

    deploy:
        if: >-
            github.event_name == 'workflow_dispatch' &&
            inputs.deploy &&
            github.ref == 'refs/heads/master'
        needs: verify
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}
            - name: Upload immutable assets
              run: >-
                  aws s3 sync dist/ s3://${{ vars.SITE_BUCKET }} --delete
                  --exclude index.html
                  --acl public-read
                  --cache-control 'public, max-age=31536000, immutable'
            - name: Upload HTML
              run: >-
                  aws s3 cp dist/index.html s3://${{ vars.SITE_BUCKET }}/index.html
                  --acl public-read
                  --cache-control 'no-cache, no-store, must-revalidate'
                  --content-type 'text/html; charset=utf-8'
            - name: Invalidate CloudFront
              if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
              run: >-
                  aws cloudfront create-invalidation
                  --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
                  --paths '/index.html' '/'
